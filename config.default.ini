[DEFAULT]

# ===================================
# SmartShunt to BMS Converter Config
# ===================================
# 
# This service converts each SmartShunt into a virtual BMS (Battery Management System).
# It enables DVCC charge control for "dumb" batteries that don't have built-in BMS communication.
#
# Copy settings you want to change to config.ini (config.ini is ignored by git)
# 
# Quick Start Guide:
# 1. Copy this file to config.ini
# 2. Set MAX_CHARGE_VOLTAGE, MAX_CHARGE_CURRENT, MAX_DISCHARGE_CURRENT
# 3. Review TEMP_COLD_DANGER and TEMP_HOT_DANGER
# 4. Optionally set DEVICE_NAME and EXCLUDE_SHUNTS
# 5. Run ./install.sh and ./enable.sh

# ----- Battery Charge Limits -----
# These are published to DVCC for charge control
# Leave empty to not publish (service will only pass through SmartShunt data without charge control)

# Maximum charging voltage (V)
# This is your bulk charging voltage - DVCC will limit charging to this voltage
# Example: 14.6V for LiFePO4 bulk charging, 14.2V for absorption
# NOTE: These values are per SmartShunt. If a SmartShunt monitors multiple batteries,
# these limits apply to ALL batteries monitored by that SmartShunt.
MAX_CHARGE_VOLTAGE = 14.6

# Maximum charge current (A)
# DVCC will limit total charge current to this value
# Recommended: 0.5C to 1C for LiFePO4 (e.g., 50A for 100Ah, 100A for 200Ah)
# Be conservative - this is a safety limit
MAX_CHARGE_CURRENT = 50

# Maximum discharge current (A)
# DVCC will limit total discharge current to this value
# Recommended: 0.5C to 1C for LiFePO4 (e.g., 50A for 100Ah, 200A for 200Ah)
MAX_DISCHARGE_CURRENT = 100

# ----- Temperature Safety Thresholds -----
# AllowToCharge is set to 0 (disable charging) if temperature is outside safe range

# Cold danger threshold (°C)
# Charging disabled if temperature <= this value
# LiFePO4 should not be charged below freezing (0°C)
# Set to 5°C for safety margin
TEMP_COLD_DANGER = 5.0

# Hot danger threshold (°C) 
# Charging disabled if temperature >= this value
# LiFePO4 max operating temp is typically 45-60°C
# Set to 45°C for safety
TEMP_HOT_DANGER = 45.0

# ----- Device Discovery -----
# The service automatically discovers SmartShunts on the D-Bus

# Optional: Exclude specific SmartShunts from conversion
# Comma-separated list of D-Bus service names to ignore
# Example: EXCLUDE_SHUNTS = com.victronenergy.battery.ttyUSB0, com.victronenergy.battery.ttyS7
# Leave empty to convert all SmartShunts
EXCLUDE_SHUNTS = 

# ----- Device Naming -----
# Custom name for the virtual BMS devices
# Leave empty to use default naming: "SmartShunt BMS <instance>"
# If set, will be used as a prefix: "<DEVICE_NAME> <instance>"
DEVICE_NAME = 

# ----- Logging -----
# Status update interval (seconds)
# How often to log current state
STATUS_UPDATE_INTERVAL = 300
